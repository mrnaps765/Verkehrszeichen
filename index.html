<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Testtrainer Polizei NRW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e8eb; --surface:#ffffff; --ink:#1d2228; --muted:#5d6670; --line:#cfd4da;
  --blue:#0b5ea8; --blue-ink:#ffffff; --ok:#1d7a3e; --ok-bg:#e1f2e6; --bad:#b3121f; --bad-bg:#fbe3e5; --sel-bg:#dbe8f6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1f24; --surface:#262b32; --ink:#eef1f4; --muted:#a3adb8; --line:#3a414a;
    --blue:#3d8fe0; --ok:#5fcf87; --ok-bg:#1f3a29; --bad:#ff7a84; --bad-bg:#43222a; --sel-bg:#1d3550;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1f24; --surface:#262b32; --ink:#eef1f4; --muted:#a3adb8; --line:#3a414a;
  --blue:#3d8fe0; --ok:#5fcf87; --ok-bg:#1f3a29; --bad:#ff7a84; --bad-bg:#43222a; --sel-bg:#1d3550;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font:800 clamp(28px,6vw,40px)/1.05 "Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;margin:8px 0 4px}
h2{font:700 24px/1.15 "Barlow Semi Condensed",Arial,sans-serif;margin:0}
.lead{color:var(--muted);margin:0 0 8px;max-width:62ch}
.muted{color:var(--muted)}
.group-h{font:700 14px "Barlow Semi Condensed",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mod{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.mod:hover{border-color:var(--blue)}
.mod b{display:block;font:700 18px/1.2 "Barlow Semi Condensed",Arial,sans-serif}
.mod span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.mod em{display:block;font-style:normal;font-size:13px;color:var(--ok);margin-top:4px;font-weight:600}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.modhead{display:flex;align-items:center;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.back{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 14px "Barlow Semi Condensed",Arial,sans-serif;cursor:pointer}
.card{background:var(--surface);border-radius:14px;padding:18px;border:1px solid var(--line)}
.card p:first-child{margin-top:0}
.btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1 1 140px;border:0;border-radius:10px;padding:13px 14px;font:700 17px "Barlow Semi Condensed",Arial,sans-serif;cursor:pointer;background:var(--blue);color:var(--blue-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.progress{font:600 14px "Barlow Semi Condensed",Arial,sans-serif;color:var(--muted);text-align:center;margin-bottom:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 auto 16px;max-width:320px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s linear}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;font:600 19px/1.35 "Barlow Semi Condensed",Arial,sans-serif}
.prompt .small{font:400 15px/1.45 Barlow,Arial,sans-serif;color:var(--muted);display:block;margin-top:6px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font:600 16px/1.3 Barlow,Arial,sans-serif;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.sel{border-color:var(--blue);background:var(--sel-bg)}
.opt:disabled{cursor:default}
.imgopts{grid-template-columns:repeat(2,1fr)}
.imgopts .opt{display:flex;justify-content:center;padding:12px}
.imgopts .opt svg{width:min(28vw,110px);height:auto}
.sixopts{grid-template-columns:repeat(3,1fr)}
.sixopts .opt svg{width:min(22vw,90px)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.result{text-align:center}
.result .big{font:800 56px/1 "Barlow Semi Condensed",Arial,sans-serif}
.timer{text-align:center;font:700 20px "Barlow Semi Condensed",Arial,sans-serif;margin-bottom:4px}
.persons{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.pcard{display:grid;grid-template-columns:60px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-top:4px solid #b3121f;border-radius:10px;padding:12px}
.pcard .wanted{font:800 12px "Barlow Semi Condensed",Arial,sans-serif;letter-spacing:.12em;color:#b3121f}
.pcard h3{margin:0 0 4px;font:700 18px "Barlow Semi Condensed",Arial,sans-serif}
.pcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:14px}
.pcard dt{color:var(--muted)}
.pcard dd{margin:0}
.scene>svg{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
.readtext{font-size:17px;line-height:1.65}
.eqs{font:700 26px/1.7 "Barlow Semi Condensed",Arial,sans-serif;text-align:center;margin:6px 0}
.s0{color:#c8102e}.s1{color:#0b5ea8}.s2{color:#1d7a3e}.s3{color:#b8860b}.s4{color:#7a3fb0}
.figrow{display:flex;gap:5px;justify-content:center;margin-top:10px}
.figrow svg{width:min(14vw,68px);height:auto}
.flow{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:10px;font:600 17px Barlow,Arial,sans-serif}
.fbox{border:2px solid var(--ink);border-radius:8px;padding:5px 16px;background:var(--bg)}
.fdia{border:2px dashed var(--blue);border-radius:6px;padding:6px 12px;text-align:center}
.fsplit{display:flex;gap:22px}
.fsplit>div{display:flex;flex-direction:column;align-items:center;gap:2px}
.fsplit small{color:var(--muted);font-weight:700}
.arr{color:var(--muted);line-height:1}
.tscroll{overflow-x:auto}
.dtable{border-collapse:collapse;margin:10px 0 0;font:500 15px Barlow,Arial,sans-serif;min-width:320px}
.dtable th,.dtable td{border:1px solid var(--line);padding:5px 9px;text-align:center}
.dtable th{background:var(--bg)}
.rules{margin:0;padding-left:20px}
.rules li{margin-bottom:8px}
.blitz{display:flex;gap:10px;justify-content:center;padding:20px 0}
.blitz svg{width:min(26vw,120px);height:auto}
.foot{font-size:14px;color:var(--muted);margin-top:30px;max-width:62ch}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <main id="app"></main>
</div>
<script>
const R='#c8102e',B='#0b5ea8',Y='#f5c400',G='#16823a',F='font-family="Arial,Helvetica,sans-serif" text-anchor="middle"';
const svg=s=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}</svg>`;
const tri=i=>`<polygon points="50,8 94,86 6,86" fill="#fff" stroke="${R}" stroke-width="8" stroke-linejoin="round"/>${i}`;
const redC=i=>`<circle cx="50" cy="50" r="42" fill="#fff" stroke="${R}" stroke-width="9"/>${i}`;
const blueC=i=>`<circle cx="50" cy="50" r="44" fill="${B}" stroke="#fff" stroke-width="2"/>${i}`;
const blueS=i=>`<rect x="7" y="7" width="86" height="86" rx="6" fill="${B}" stroke="#fff" stroke-width="2"/>${i}`;
const up=(x,c)=>`<path d="M${x} 74 L${x} 40" stroke="${c}" stroke-width="7"/><polygon points="${x},25 ${x-9},42 ${x+9},42" fill="${c}"/>`;
const down=(x,c)=>`<path d="M${x} 26 L${x} 60" stroke="${c}" stroke-width="7"/><polygon points="${x},75 ${x-9},58 ${x+9},58" fill="${c}"/>`;
const stripes=(id,shape,col,w,offs)=>`<clipPath id="${id}">${shape}</clipPath><g clip-path="url(#${id})" stroke="${col}" stroke-width="${w}">${offs.map(k=>`<line x1="0" y1="${100+k}" x2="${100+k}" y2="0"/>`).join('')}</g>`;
const scar=(x,c)=>`<rect x="${x}" y="38" width="20" height="26" rx="5" fill="${c}"/><rect x="${x+3}" y="42" width="14" height="8" rx="2" fill="#fff"/><rect x="${x+1}" y="61" width="5" height="8" fill="${c}"/><rect x="${x+14}" y="61" width="5" height="8" fill="${c}"/>`;
const round3=()=>{const a=`<path d="M58.6 73.5 A25 25 0 0 0 75 50" fill="none" stroke="#fff" stroke-width="7"/><polygon points="75,39 68,52 82,52" fill="#fff"/>`;return [0,120,240].map(r=>`<g transform="rotate(${r} 50 50)">${a}</g>`).join('')};

const SIGNS=[
 {nr:'101',cat:'Gefahrzeichen',name:'Gefahrstelle',meaning:'Warnt vor einer Gefahrstelle. Die Art der Gefahr steht oft auf einem Zusatzzeichen darunter.',
  s:tri(`<rect x="46" y="36" width="8" height="30" rx="2" fill="#111"/><circle cx="50" cy="74" r="4.6" fill="#111"/>`)},
 {nr:'102',cat:'Gefahrzeichen',name:'Kreuzung oder Einmündung mit Vorfahrt von rechts',meaning:'An der nächsten Kreuzung oder Einmündung gilt „rechts vor links“.',
  s:tri(`<path d="M37 42 L63 80 M63 42 L37 80" stroke="#111" stroke-width="7"/>`)},
 {nr:'103',cat:'Gefahrzeichen',name:'Kurve (rechts)',meaning:'Warnt vor einer Rechtskurve – Geschwindigkeit anpassen. Gespiegelt warnt es vor einer Linkskurve.',
  s:tri(`<path d="M44 82 L44 63 Q44 46 62 44" fill="none" stroke="#111" stroke-width="7"/>`)},
 {nr:'120',cat:'Gefahrzeichen',name:'Verengte Fahrbahn',meaning:'Die Fahrbahn wird auf beiden Seiten schmaler.',
  s:tri(`<path d="M34 82 L34 70 L43 57 L43 42 M66 82 L66 70 L57 57 L57 42" fill="none" stroke="#111" stroke-width="5"/>`)},
 {nr:'131',cat:'Gefahrzeichen',name:'Lichtzeichenanlage',meaning:'Warnt vor einer Ampel, mit der man an dieser Stelle nicht rechnet.',
  s:tri(`<rect x="41" y="35" width="18" height="47" rx="4" fill="#111"/><circle cx="50" cy="45" r="5" fill="#e3141f"/><circle cx="50" cy="59" r="5" fill="#f5b800"/><circle cx="50" cy="73" r="5" fill="#1a9a3a"/>`)},
 {nr:'201',cat:'Vorschriftzeichen',name:'Andreaskreuz',meaning:'Bahnübergang: Schienenfahrzeuge haben Vorrang.',
  s:[35,-35].map(r=>`<g transform="rotate(${r} 50 50)"><rect x="3" y="43" width="94" height="14" fill="#fff" stroke="${R}" stroke-width="2.5"/><rect x="3" y="43" width="18" height="14" fill="${R}"/><rect x="79" y="43" width="18" height="14" fill="${R}"/><rect x="41" y="43" width="18" height="14" fill="${R}"/></g>`).join('')},
 {nr:'205',cat:'Vorschriftzeichen',name:'Vorfahrt gewähren',meaning:'Wartepflicht: Der Verkehr auf der kreuzenden Straße hat Vorfahrt.',
  s:`<polygon points="6,12 94,12 50,90" fill="#fff" stroke="${R}" stroke-width="9" stroke-linejoin="round"/>`},
 {nr:'206',cat:'Vorschriftzeichen',name:'Halt. Vorfahrt gewähren.',meaning:'Immer anhalten (an der Haltlinie) und dann dem Querverkehr Vorfahrt gewähren.',
  s:`<polygon points="92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4" fill="${R}" stroke="#fff" stroke-width="3"/><text x="50" y="59" ${F} font-size="25" font-weight="800" fill="#fff">STOP</text>`},
 {nr:'208',cat:'Vorschriftzeichen',name:'Vorrang des Gegenverkehrs',meaning:'An der Engstelle muss man den Gegenverkehr zuerst durchfahren lassen.',
  s:redC(up(38,R)+down(62,'#111'))},
 {nr:'209',cat:'Vorschriftzeichen',name:'Vorgeschriebene Fahrtrichtung – rechts',meaning:'An der nächsten Kreuzung darf man nur nach rechts abbiegen.',
  s:blueC(`<path d="M40 77 L40 53 Q40 41 52 41 L58 41" fill="none" stroke="#fff" stroke-width="9"/><polygon points="75,41 58,28 58,54" fill="#fff"/>`)},
 {nr:'215',cat:'Vorschriftzeichen',name:'Kreisverkehr',meaning:'Im Kreis nur in Pfeilrichtung fahren; auf der Kreisfahrbahn darf man nicht halten.',
  s:blueC(round3())},
 {nr:'220',cat:'Vorschriftzeichen',name:'Einbahnstraße',meaning:'Die Straße darf nur in Pfeilrichtung befahren werden.',
  s:`<rect x="3" y="30" width="94" height="40" rx="3" fill="${B}" stroke="#fff" stroke-width="1.5"/><polygon points="8,41 70,41 70,34 93,50 70,66 70,59 8,59" fill="#fff"/><text x="39" y="53.5" ${F} font-size="8.5" font-weight="700" fill="#111">Einbahnstraße</text>`},
 {nr:'224',cat:'Vorschriftzeichen',name:'Haltestelle',meaning:'Haltestelle für Linienbusse oder Straßenbahnen.',
  s:`<circle cx="50" cy="50" r="42" fill="${Y}" stroke="${G}" stroke-width="7"/><text x="50" y="65" ${F} font-size="42" font-weight="800" fill="${G}">H</text>`},
 {nr:'237',cat:'Vorschriftzeichen',name:'Radweg',meaning:'Radfahrer müssen diesen Weg benutzen; andere Fahrzeuge dürfen ihn nicht befahren.',
  s:blueC(`<g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="31" cy="61" r="11"/><circle cx="69" cy="61" r="11"/><path d="M31 61 L50 61 L44 42 L31 61 M44 42 L62 42 L50 61 M62 42 L69 61 M62 42 L60 34 L66 34 M40 40 L48 40"/></g>`)},
 {nr:'250',cat:'Vorschriftzeichen',name:'Verbot für Fahrzeuge aller Art',meaning:'Kein Fahrzeug darf hier fahren. Fahrräder dürfen geschoben werden.',
  s:redC('')},
 {nr:'267',cat:'Vorschriftzeichen',name:'Verbot der Einfahrt',meaning:'Man darf nicht in die Straße hineinfahren – typisch am Ende einer Einbahnstraße.',
  s:`<circle cx="50" cy="50" r="44" fill="${R}" stroke="#fff" stroke-width="2"/><rect x="17" y="42" width="66" height="16" fill="#fff"/>`},
 {nr:'274',cat:'Vorschriftzeichen',name:'Zulässige Höchstgeschwindigkeit',meaning:'Man darf nicht schneller fahren als angegeben (hier 50 km/h).',
  s:redC(`<text x="50" y="63" ${F} font-size="36" font-weight="700" fill="#111">50</text>`)},
 {nr:'274.1',cat:'Vorschriftzeichen',name:'Beginn einer Tempo 30-Zone',meaning:'Ab hier gilt in der ganzen Zone höchstens 30 km/h.',
  s:`<rect x="12" y="4" width="76" height="92" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="50" cy="38" r="25" fill="#fff" stroke="${R}" stroke-width="6"/><text x="50" y="47" ${F} font-size="24" font-weight="700" fill="#111">30</text><text x="50" y="84" ${F} font-size="18" font-weight="800" fill="#111">ZONE</text>`},
 {nr:'276',cat:'Vorschriftzeichen',name:'Überholverbot für Kraftfahrzeuge aller Art',meaning:'Kraftfahrzeuge dürfen keine mehrspurigen Kraftfahrzeuge (und Motorräder mit Beiwagen) überholen.',
  s:redC(scar(26,R)+scar(54,'#111'))},
 {nr:'278',cat:'Vorschriftzeichen',name:'Ende der zulässigen Höchstgeschwindigkeit',meaning:'Die vorher angeordnete Höchstgeschwindigkeit (hier 50 km/h) gilt nicht mehr.',
  s:`<circle cx="50" cy="50" r="43" fill="#fff" stroke="#8a8f95" stroke-width="2"/><text x="50" y="63" ${F} font-size="36" font-weight="700" fill="#8a8f95">50</text>`+stripes('c278','<circle cx="50" cy="50" r="41"/>','#555',2.5,[-10,0,10])},
 {nr:'282',cat:'Vorschriftzeichen',name:'Ende sämtlicher Streckenverbote',meaning:'Alle vorher angeordneten Geschwindigkeitsbegrenzungen und Überholverbote enden.',
  s:`<circle cx="50" cy="50" r="43" fill="#fff" stroke="#333" stroke-width="2"/>`+stripes('c282','<circle cx="50" cy="50" r="41"/>','#111',3.5,[-28,-14,0,14,28])},
 {nr:'283',cat:'Vorschriftzeichen',name:'Absolutes Haltverbot',meaning:'Halten ist verboten – auch nur ganz kurz.',
  s:`<circle cx="50" cy="50" r="42" fill="${B}" stroke="${R}" stroke-width="9"/><path d="M22 22 L78 78 M78 22 L22 78" stroke="${R}" stroke-width="9"/>`},
 {nr:'286',cat:'Vorschriftzeichen',name:'Eingeschränktes Haltverbot',meaning:'Halten nur bis 3 Minuten zum Ein- oder Aussteigen oder Be- und Entladen; Parken ist verboten.',
  s:`<circle cx="50" cy="50" r="42" fill="${B}" stroke="${R}" stroke-width="9"/><path d="M22 22 L78 78" stroke="${R}" stroke-width="9"/>`},
 {nr:'301',cat:'Richtzeichen',name:'Vorfahrt',meaning:'Vorfahrt nur an der nächsten Kreuzung oder Einmündung.',
  s:tri(`<polygon points="46,36 54,36 58,81 42,81" fill="#111"/><rect x="35" y="57" width="30" height="4" fill="#111"/>`)},
 {nr:'306',cat:'Richtzeichen',name:'Vorfahrtstraße',meaning:'Man hat Vorfahrt bis zum nächsten Zeichen „Vorfahrt gewähren“, „Halt“ oder „Ende der Vorfahrtstraße“.',
  s:`<polygon points="50,4 96,50 50,96 4,50" fill="#fff" stroke="#555" stroke-width="1.5"/><polygon points="50,18 82,50 50,82 18,50" fill="${Y}"/>`},
 {nr:'307',cat:'Richtzeichen',name:'Ende der Vorfahrtstraße',meaning:'Die Vorfahrtstraße endet – ab hier gelten wieder die normalen Vorfahrtregeln.',
  s:`<polygon points="50,4 96,50 50,96 4,50" fill="#fff" stroke="#555" stroke-width="1.5"/><polygon points="50,18 82,50 50,82 18,50" fill="${Y}"/>`+stripes('c307','<polygon points="50,6 94,50 50,94 6,50"/>','#222',3,[-16,-8,0,8,16])},
 {nr:'308',cat:'Richtzeichen',name:'Vorrang vor dem Gegenverkehr',meaning:'An der Engstelle darf man vor dem Gegenverkehr durchfahren.',
  s:blueS(up(38,'#fff')+down(62,R))},
 {nr:'310',cat:'Richtzeichen',name:'Ortstafel – Anfang',meaning:'Beginn einer geschlossenen Ortschaft: innerorts gilt höchstens 50 km/h.',
  s:`<rect x="3" y="24" width="94" height="52" rx="4" fill="${Y}" stroke="#111" stroke-width="2.5"/><text x="50" y="52" ${F} font-size="14" font-weight="800" fill="#111">Musterstadt</text><text x="50" y="66" ${F} font-size="8" fill="#111">Kreis Beispiel</text>`},
 {nr:'311',cat:'Richtzeichen',name:'Ortstafel – Ende',meaning:'Ende der geschlossenen Ortschaft: die Innerortsregeln (z. B. 50 km/h) enden.',
  s:`<rect x="3" y="24" width="94" height="52" rx="4" fill="${Y}" stroke="#111" stroke-width="2.5"/><text x="50" y="42" ${F} font-size="10" font-weight="700" fill="#111">Nachbarort 5 km</text><text x="50" y="64" ${F} font-size="13" font-weight="800" fill="#111">Musterstadt</text><path d="M10 72 L90 48" stroke="${R}" stroke-width="5"/>`},
 {nr:'314',cat:'Richtzeichen',name:'Parken',meaning:'Hier darf geparkt werden (Parkplatz).',
  s:blueS(`<text x="50" y="72" ${F} font-size="62" font-weight="800" fill="#fff">P</text>`)},
 {nr:'357',cat:'Richtzeichen',name:'Sackgasse',meaning:'Die Straße hat keine Durchfahrt für Fahrzeuge.',
  s:blueS(`<rect x="43" y="38" width="14" height="48" fill="#fff"/><rect x="22" y="20" width="56" height="17" fill="${R}"/>`)}
];


const $=s=>document.querySelector(s);
const app=()=>document.getElementById('app');
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,k)=>shuffle(a).slice(0,k);
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const sv=(inner,vb='0 0 100 100')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
function Q(html,correct,wrongs,ex,cls){const opts=shuffle([correct,...wrongs]);return{html,opts,ok:opts.indexOf(correct),ex,cls}}
function near(ans,k,min=0){const c=shuffle(range(Math.max(min,ans-6),ans+6).filter(x=>x!==ans));return c.slice(0,k).map(String)}
function getBest(id){try{return JSON.parse(localStorage.getItem('pt-best')||'{}')[id]}catch(e){return null}}
function setBest(id,p){try{const o=JSON.parse(localStorage.getItem('pt-best')||'{}');if(o[id]==null||p>o[id]){o[id]=p;localStorage.setItem('pt-best',JSON.stringify(o))}}catch(e){}}
let TIMER=null;const stopTimer=()=>{clearInterval(TIMER);TIMER=null};
const head=m=>`<div class="modhead"><button class="back" onclick="home()">← Übersicht</button><h2>${m.title}</h2></div>`;

/* ---------- Quiz-Engine ---------- */
function runQuiz(m,qs,restart){
  let i=0,score=0,picked=null;
  function r(){
    if(i>=qs.length){
      const p=Math.round(score/qs.length*100);setBest(m.id,p);
      app().innerHTML=head(m)+`<div class="card result"><div class="big">${score}/${qs.length}</div><p>${p===100?'Alles richtig!':p>=70?'Gut gemacht – weiter so.':'Noch eine Runde lohnt sich.'}</p><div class="btnrow"><button class="btn" id="again">Neue Runde</button><button class="btn ghost" onclick="home()">Zur Übersicht</button></div></div>`;
      $('#again').onclick=restart;return;
    }
    const q=qs[i],cls=k=>picked==null?'':k===q.ok?'right':k===picked?'wrong':'';
    app().innerHTML=head(m)+`<div class="progress">Frage ${i+1} von ${qs.length} · ${score} richtig</div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
    <div class="prompt">${q.html}</div>
    <div class="opts ${q.cls||''}">${q.opts.map((o,k)=>`<button class="opt ${cls(k)}" data-k="${k}" ${picked!=null?'disabled':''}>${o}</button>`).join('')}</div>
    ${picked==null?'':`<div class="feedback"><strong>${picked===q.ok?'Richtig.':'Leider falsch.'}</strong>${q.ex?' '+q.ex:''}</div><div class="btnrow"><button class="btn" id="next">Weiter</button></div>`}`;
    app().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{picked=+b.dataset.k;if(picked===q.ok)score++;r()});
    if(picked!=null)$('#next').onclick=()=>{i++;picked=null;r();window.scrollTo(0,0)};
  }

}
function timeLabel(t){return t%60===0?(t===60?'1 Minute':t/60+' Minuten'):t+' Sekunden'}
function chooseTime(m,intro,times,def,cb){
  app().innerHTML=head(m)+`<div class="card"><p>${intro}</p><p class="muted">Zeit zum Einprägen:</p><div class="btnrow">${times.map(t=>`<button class="btn ${t===def?'':'ghost'}" data-t="${t}">${timeLabel(t)}</button>`).join('')}</div></div>`;
  app().querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>cb(+b.dataset.t));
}
function study(m,html,secs,done){
  stopTimer();let left=secs;
  app().innerHTML=head(m)+`<div class="timer"><span id="tleft">${left}</span> Sekunden</div><div class="bar"><i id="tbar" style="width:100%"></i></div><div>${html}</div><div class="btnrow"><button class="btn" id="fin">Fertig – zu den Fragen</button></div>`;
  const end=()=>{stopTimer();window.scrollTo(0,0);done()};
  $('#fin').onclick=end;
  TIMER=setInterval(()=>{left--;if(left<=0)return end();$('#tleft').textContent=left;$('#tbar').style.width=(left/secs*100)+'%'},1000);
}

const SYM=['▲','●','■','◆','★'];
function genSym(){
  const idx=sample([0,1,2,3,4],3),v=sample(range(1,9),3),s=idx.map(i=>`<span class="s${i}">${SYM[i]}</span>`);
  const [a,b,c]=s,[va,vb,vc]=v,t=rnd(3);
  const e3=t===0?`${b} + ${c} = ${vb+vc}`:t===1?`${b} × ${c} = ${vb*vc}`:(vc>vb?`${c} − ${b} = ${vc-vb}`:`${b} − ${c} = ${vb-vc}`);
  const all=rnd(2)===1,ans=all?va+vb+vc:vc;

  const shown=sample(SIGNS,3),opts=shuffle([...shown,...sample(SIGNS.filter(x=>!shown.includes(x)),3)]);
  app().innerHTML=head(m)+`<div class="progress">Runde ${round+1} von ${ROUNDS}</div><div class="card"><p class="muted" style="text-align:center;margin:0">Gut hinsehen …</p><div class="blitz">${shown.map(s=>svg(s.s)).join('')}</div></div>`;
  stopTimer();TIMER=setTimeout(()=>{
    const sel=new Set();let done=false;

      if(!done){app().querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;sel.has(k)?sel.delete(k):sel.size<3&&sel.add(k);r()});$('#chk').onclick=()=>{if(sel.size===3){done=true;r()}}}
      else $('#next').onclick=()=>blitz(m,round+1,score+(ok()?1:0));
    };

 {id:'ana',g:'Logik & Analyse',title:'Wortanalogien',d:'A verhält sich zu B wie C zu …?',run:m=>runQuiz(m,sample(ANA,8).map(anaQ),()=>MODS[7].run(m))},
 {id:'data',g:'Logik & Analyse',title:'Datenanalyse',d:'Tabellen lesen und auswerten',run:m=>runQuiz(m,range(1,6).map(genData),()=>MODS[8].run(m))},
 {id:'tm',g:'Logik & Analyse',title:'Tatsache oder Meinung',d:'Überprüfbare Aussage oder Wertung?',run:m=>runQuiz(m,sample(TM,10).map(tmQ),()=>MODS[9].run(m))},
 {id:'rs',g:'Deutsch',title:'Rechtschreibung',d:'Typische Fehlerwörter, das/dass, seit/seid',run:m=>runQuiz(m,sample(RS,10).map(rsQ),()=>MODS[10].run(m))},
 {id:'zs',g:'Deutsch',title:'Zeichensetzung',d:'Den richtig geschriebenen Satz finden',run:m=>runQuiz(m,sample(ZS,8).map(zsQ),()=>MODS[11].run(m))},
 {id:'str',g:'Deutsch',title:'Straßennamen',d:'Zusammen, getrennt oder mit Bindestrich?',run:startStreets},
 {id:'vz',g:'Extra',title:'Verkehrszeichen',d:'Namen-Quiz und Blitz-Modus',run:startSigns}
];
function home(){
  stopTimer();clearTimeout(TIMER);
  const groups=[...new Set(MODS.map(m=>m.g))];
  app().innerHTML=`<h1>Testtrainer Polizei NRW</h1><p class="lead">Übungen zum PC-Test am ersten Verfahrenstag: Gedächtnis, Logik und Deutsch. Jede Runde wird neu gemischt.</p>`+
  groups.map(g=>`<div class="group-h">${g}</div><div class="grid">${MODS.filter(m=>m.g===g).map(m=>{const b=getBest(m.id);return `<button class="mod" data-id="${m.id}"><b>${m.title}</b><span>${m.d}</span>${b!=null?`<em>Bestwert: ${b} %</em>`:''}</button>`}).join('')}</div>`).join('')+
  `<p class="foot">Grundlage ist das Info-Blatt der Polizei Köln zum Auswahlverfahren. Die Aufgaben sind Übungsbeispiele, keine Originalaufgaben. Aktuelle Infos gibt es auf genau-mein-fall.de und bei der Einstellungsberatung der Polizei Köln.</p>`;
  app().querySelectorAll('.mod').forEach(b=>b.onclick=()=>{const m=MODS.find(x=>x.id===b.dataset.id);window.scrollTo(0,0);m.run(m)});
}
home();
</script>
</body>
